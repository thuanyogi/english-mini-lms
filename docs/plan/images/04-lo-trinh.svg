<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">Lộ trình: 9 bước, làm tuần tự, mỗi bước 1 phiên chat</text>

  <!-- phase labels -->
  <text x="75" y="76" text-anchor="middle" font-size="11" fill="#6b7280">CHUẨN BỊ</text>
  <text x="255" y="76" text-anchor="middle" font-size="11" fill="#6b7280">NỀN MÓNG</text>
  <text x="540" y="76" text-anchor="middle" font-size="11" fill="#6b7280">TÍNH NĂNG HỌC (làm trên laptop, test trên điện thoại)</text>
  <text x="800" y="76" text-anchor="middle" font-size="11" fill="#6b7280">RA MẮT + DÙNG THẬT</text>

  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7c2"/>
    </marker>
  </defs>

  <!-- boxes row: 9 steps -->
  <!-- step 0 -->
  <rect x="30" y="90" width="85" height="120" rx="10" fill="#f1ecfb" stroke="#7b5cd6" stroke-width="2"/>
  <text x="72" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#5a3fb8">0</text>
  <text x="72" y="140" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Tài khoản</text>
  <text x="72" y="155" text-anchor="middle" font-size="10.5" fill="#1a1a2e">+ mở repo</text>
  <text x="72" y="185" text-anchor="middle" font-size="10" fill="#6b7280">~2h, làm tay</text>

  <!-- step 1 -->
  <rect x="125" y="90" width="85" height="120" rx="10" fill="#e8f4fd" stroke="#2f80ed" stroke-width="2"/>
  <text x="167" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#1a5fb4">1</text>
  <text x="167" y="140" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Khung app</text>
  <text x="167" y="155" text-anchor="middle" font-size="10.5" fill="#1a1a2e">+ đăng nhập</text>
  <text x="167" y="185" text-anchor="middle" font-size="10" fill="#6b7280">3–5h</text>

  <!-- step 2 -->
  <rect x="220" y="90" width="85" height="120" rx="10" fill="#e8f4fd" stroke="#2f80ed" stroke-width="2"/>
  <text x="262" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#1a5fb4">2</text>
  <text x="262" y="140" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Thư viện</text>
  <text x="262" y="155" text-anchor="middle" font-size="10.5" fill="#1a1a2e">+ soạn 3 bài</text>
  <text x="262" y="185" text-anchor="middle" font-size="10" fill="#6b7280">3–4h</text>

  <!-- step 3 -->
  <rect x="315" y="90" width="85" height="120" rx="10" fill="#fdf3e3" stroke="#e6a23c" stroke-width="2.5"/>
  <text x="357" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#b26a00">3 ⭐</text>
  <text x="357" y="140" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Viết → chấm</text>
  <text x="357" y="155" text-anchor="middle" font-size="10.5" fill="#1a1a2e">→ viết lại</text>
  <text x="357" y="185" text-anchor="middle" font-size="10" fill="#6b7280">5–8h</text>

  <!-- step 4 -->
  <rect x="410" y="90" width="85" height="120" rx="10" fill="#fdf3e3" stroke="#e6a23c" stroke-width="2"/>
  <text x="452" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#b26a00">4</text>
  <text x="452" y="140" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Đọc–dịch</text>
  <text x="452" y="155" text-anchor="middle" font-size="10.5" fill="#1a1a2e">+ Sổ từ</text>
  <text x="452" y="185" text-anchor="middle" font-size="10" fill="#6b7280">5–8h</text>

  <!-- step 5 -->
  <rect x="505" y="90" width="85" height="120" rx="10" fill="#fdf3e3" stroke="#e6a23c" stroke-width="2"/>
  <text x="547" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#b26a00">5</text>
  <text x="547" y="140" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Nói (ghi âm)</text>
  <text x="547" y="155" text-anchor="middle" font-size="10.5" fill="#1a1a2e">+ Nghe video</text>
  <text x="547" y="185" text-anchor="middle" font-size="10" fill="#6b7280">8–12h</text>

  <!-- step 6 -->
  <rect x="600" y="90" width="85" height="120" rx="10" fill="#fdf3e3" stroke="#e6a23c" stroke-width="2"/>
  <text x="642" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#b26a00">6</text>
  <text x="642" y="140" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Hôm nay,</text>
  <text x="642" y="155" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Tiến độ</text>
  <text x="642" y="185" text-anchor="middle" font-size="10" fill="#6b7280">4–6h</text>

  <!-- step 7 -->
  <rect x="695" y="90" width="85" height="120" rx="10" fill="#eaf7ec" stroke="#3aa757" stroke-width="2"/>
  <text x="737" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#237a3c">7</text>
  <text x="737" y="140" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Lên mạng</text>
  <text x="737" y="155" text-anchor="middle" font-size="10.5" fill="#1a1a2e">+ backup</text>
  <text x="737" y="185" text-anchor="middle" font-size="10" fill="#6b7280">3–5h</text>

  <!-- step 8 -->
  <rect x="790" y="90" width="85" height="120" rx="10" fill="#eaf7ec" stroke="#3aa757" stroke-width="2"/>
  <text x="832" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#237a3c">8</text>
  <text x="832" y="140" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Pilot</text>
  <text x="832" y="155" text-anchor="middle" font-size="10.5" fill="#1a1a2e">4 tuần</text>
  <text x="832" y="185" text-anchor="middle" font-size="10" fill="#6b7280">học thật</text>

  <!-- arrows -->
  <line x1="115" y1="150" x2="125" y2="150" stroke="#9aa7c2" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="210" y1="150" x2="220" y2="150" stroke="#9aa7c2" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="305" y1="150" x2="315" y2="150" stroke="#9aa7c2" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="400" y1="150" x2="410" y2="150" stroke="#9aa7c2" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="495" y1="150" x2="505" y2="150" stroke="#9aa7c2" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="590" y1="150" x2="600" y2="150" stroke="#9aa7c2" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="685" y1="150" x2="695" y2="150" stroke="#9aa7c2" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="780" y1="150" x2="790" y2="150" stroke="#9aa7c2" stroke-width="2" marker-end="url(#arr3)"/>

  <text x="450" y="245" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Tổng ~30–40 giờ, trải ra 2–4 tuần tuỳ lịch anh. Bước 3 là mốc quan trọng nhất: viết → AI chấm → viết lại.</text>
  <text x="450" y="268" text-anchor="middle" font-size="12.5" fill="#6b7280">Bước 9 (IELTS có giờ + Zalo) làm sau, khi bản Lite đã ổn — không vội.</text>

  <!-- bottom note -->
  <rect x="180" y="285" width="540" height="34" rx="8" fill="#f4f6fa" stroke="#d5dce8"/>
  <text x="450" y="307" text-anchor="middle" font-size="12" fill="#4a4a68">Mỗi bước trong file hướng dẫn đầy đủ có sẵn: việc làm tay + prompt dán sẵn + tiêu chí “xong”</text>
</svg>
