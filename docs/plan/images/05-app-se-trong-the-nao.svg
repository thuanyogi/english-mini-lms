<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">App xong sẽ trông thế nào? — 5 màn hình chính</text>

  <!-- Phone mockup -->
  <rect x="60" y="70" width="220" height="330" rx="24" fill="#1a1a2e"/>
  <rect x="70" y="85" width="200" height="290" rx="10" fill="#fafbfd"/>
  <text x="170" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Hôm nay</text>
  <rect x="85" y="130" width="170" height="52" rx="8" fill="#e8f4fd" stroke="#bcd7f5"/>
  <text x="170" y="150" text-anchor="middle" font-size="10.5" fill="#1a1a2e">Gợi ý: Viết email hội nghị</text>
  <text x="170" y="168" text-anchor="middle" font-size="10" fill="#6b7280">Vì: kỹ năng viết ít luyện tuần này</text>
  <rect x="85" y="192" width="80" height="30" rx="8" fill="#2f80ed"/>
  <text x="125" y="212" text-anchor="middle" font-size="11" fill="#fff">30 phút</text>
  <rect x="175" y="192" width="80" height="30" rx="8" fill="#eaf0fb" stroke="#bcd7f5"/>
  <text x="215" y="212" text-anchor="middle" font-size="11" fill="#1a5fb4">45 phút</text>
  <!-- bottom nav -->
  <rect x="70" y="330" width="200" height="45" fill="#ffffff" stroke="#e2e6ee"/>
  <text x="170" y="357" text-anchor="middle" font-size="9" fill="#4a4a68">Hôm nay · Thư viện · Học · Sổ từ · Tiến độ</text>
  <text x="170" y="420" text-anchor="middle" font-size="12" fill="#6b7280">Màn hình trên điện thoại</text>

  <!-- 5 tabs explanation -->
  <g font-size="13" fill="#1a1a2e">
    <rect x="320" y="80" width="510" height="56" rx="10" fill="#e8f4fd" stroke="#bcd7f5"/>
    <text x="340" y="103" font-weight="700" fill="#1a5fb4">Hôm nay</text>
    <text x="340" y="123">gợi ý 1 bài học có lý do rõ ràng, anh chọn 30 hay 45 phút</text>

    <rect x="320" y="146" width="510" height="56" rx="10" fill="#eaf7ec" stroke="#bfe3c9"/>
    <text x="340" y="169" font-weight="700" fill="#237a3c">Thư viện</text>
    <text x="340" y="189">danh sách bài do CHÍNH ANH soạn (đề viết, đoạn sách, video) — AI không tự bịa bài</text>

    <rect x="320" y="212" width="510" height="56" rx="10" fill="#fdf3e3" stroke="#f0d9ab"/>
    <text x="340" y="235" font-weight="700" fill="#b26a00">Học</text>
    <text x="340" y="255">làm bài: viết / dịch / ghi âm nói / nghe video — có đồng hồ đếm ngược</text>

    <rect x="320" y="278" width="510" height="56" rx="10" fill="#f1ecfb" stroke="#d8c9f5"/>
    <text x="340" y="301" font-weight="700" fill="#5a3fb8">Sổ từ</text>
    <text x="340" y="321">bôi đen từ lúc đọc → lưu 1 chạm → app nhắc ôn đúng lúc sắp quên</text>

    <rect x="320" y="344" width="510" height="56" rx="10" fill="#f4f6fa" stroke="#d5dce8"/>
    <text x="340" y="367" font-weight="700" fill="#4a4a68">Tiến độ</text>
    <text x="340" y="387">bài tuần này so với tuần trước, lỗi hay lặp — bằng chứng thật, không “điểm ảo”</text>
  </g>
</svg>
