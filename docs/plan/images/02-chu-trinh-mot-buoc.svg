<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">Một bước làm việc diễn ra thế nào?</text>
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Lặp lại chu trình này 8 lần (Bước 1 → Bước 7, rồi Bước 8 là dùng thử). Mỗi lần = một phiên chat riêng.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b8c"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="40" y="90" width="230" height="86" rx="12" fill="#e8f4fd" stroke="#2f80ed" stroke-width="2"/>
  <text x="155" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1a5fb4">1. Mở phiên chat mới</text>
  <text x="155" y="140" text-anchor="middle" font-size="12" fill="#1a1a2e">Gõ /build-step + số bước</text>
  <text x="155" y="158" text-anchor="middle" font-size="12" fill="#1a1a2e">dán kèm prompt trong hướng dẫn</text>

  <rect x="315" y="90" width="230" height="86" rx="12" fill="#e8f4fd" stroke="#2f80ed" stroke-width="2"/>
  <text x="430" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1a5fb4">2. Đọc Implementation Plan</text>
  <text x="430" y="140" text-anchor="middle" font-size="12" fill="#1a1a2e">AI viết kế hoạch, anh đọc</text>
  <text x="430" y="158" text-anchor="middle" font-size="12" fill="#1a1a2e">sai ý → comment sửa, đúng → duyệt</text>

  <rect x="590" y="90" width="230" height="86" rx="12" fill="#fdf3e3" stroke="#e6a23c" stroke-width="2"/>
  <text x="705" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#b26a00">3. AI viết code</text>
  <text x="705" y="140" text-anchor="middle" font-size="12" fill="#1a1a2e">Anh để AI chạy, pha cà phê</text>
  <text x="705" y="158" text-anchor="middle" font-size="12" fill="#1a1a2e">không cần đọc code</text>

  <!-- Row 2 -->
  <rect x="590" y="240" width="230" height="86" rx="12" fill="#fdf3e3" stroke="#e6a23c" stroke-width="2"/>
  <text x="705" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#b26a00">4. AI tự kiểm tra</text>
  <text x="705" y="290" text-anchor="middle" font-size="12" fill="#1a1a2e">AI gõ /verify: lint, test,</text>
  <text x="705" y="308" text-anchor="middle" font-size="12" fill="#1a1a2e">quét lộ API key, chụp màn hình</text>

  <rect x="315" y="240" width="230" height="86" rx="12" fill="#eaf7ec" stroke="#3aa757" stroke-width="2"/>
  <text x="430" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#237a3c">5. ANH TEST TAY ⭐</text>
  <text x="430" y="290" text-anchor="middle" font-size="12" fill="#1a1a2e">Mở app trên điện thoại, làm đúng</text>
  <text x="430" y="308" text-anchor="middle" font-size="12" fill="#1a1a2e">“tiêu chí xong” của bước đó</text>

  <rect x="40" y="240" width="230" height="86" rx="12" fill="#eaf7ec" stroke="#3aa757" stroke-width="2"/>
  <text x="155" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#237a3c">6. Lưu mốc (commit)</text>
  <text x="155" y="290" text-anchor="middle" font-size="12" fill="#1a1a2e">AI tự commit. git log có dòng</text>
  <text x="155" y="308" text-anchor="middle" font-size="12" fill="#1a1a2e">mới = đóng dấu “an toàn”</text>

  <!-- Arrows row 1 -->
  <line x1="270" y1="133" x2="315" y2="133" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="545" y1="133" x2="590" y2="133" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arr)"/>
  <!-- down -->
  <line x1="705" y1="176" x2="705" y2="240" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arr)"/>
  <!-- row 2 right to left -->
  <line x1="590" y1="283" x2="545" y2="283" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="315" y1="283" x2="270" y2="283" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- fail note -->
  <text x="430" y="380" text-anchor="middle" font-size="12.5" fill="#b3261e">Bước 5 fail → nói lại cho AI “bấm X mà thấy Y, mong đợi Z” → AI sửa → test lại. Đừng qua bước mới khi chưa xong.</text>
  <text x="430" y="404" text-anchor="middle" font-size="12.5" fill="#6b7280">Hỏng nặng → quay về commit trước (git có sẵn lịch sử, không mất việc đã làm).</text>
</svg>
