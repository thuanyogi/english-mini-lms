<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">App gồm những gì — và vì sao cần từng dịch vụ?</text>

  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b8c"/>
    </marker>
  </defs>

  <!-- Phone -->
  <rect x="40" y="150" width="150" height="180" rx="18" fill="#1a1a2e"/>
  <rect x="50" y="165" width="130" height="140" rx="8" fill="#ffffff"/>
  <text x="115" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Điện thoại</text>
  <text x="115" y="215" text-anchor="middle" font-size="11" fill="#4a4a68">của anh</text>
  <text x="115" y="245" text-anchor="middle" font-size="11" fill="#4a4a68">mở bằng Safari/</text>
  <text x="115" y="262" text-anchor="middle" font-size="11" fill="#4a4a68">Chrome</text>
  <text x="115" y="322" text-anchor="middle" font-size="10.5" fill="#ffffff">(thêm vào màn hình chính)</text>

  <!-- Vercel -->
  <rect x="300" y="140" width="220" height="90" rx="12" fill="#eaf0fb" stroke="#2f80ed" stroke-width="2"/>
  <text x="410" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#1a5fb4">VERCEL — “ngôi nhà” của app</text>
  <text x="410" y="192" text-anchor="middle" font-size="12" fill="#1a1a2e">chạy web 24/7, miễn phí</text>
  <text x="410" y="212" text-anchor="middle" font-size="12" fill="#1a1a2e">anh được 1 địa chỉ web riêng</text>

  <!-- Supabase -->
  <rect x="300" y="270" width="220" height="110" rx="12" fill="#eaf7ec" stroke="#3aa757" stroke-width="2"/>
  <text x="410" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#237a3c">SUPABASE — “két sắt dữ liệu”</text>
  <text x="410" y="322" text-anchor="middle" font-size="12" fill="#1a1a2e">database: bài làm, sổ từ, tiến độ</text>
  <text x="410" y="342" text-anchor="middle" font-size="12" fill="#1a1a2e">đăng nhập bằng email</text>
  <text x="410" y="362" text-anchor="middle" font-size="12" fill="#1a1a2e">lưu file ghi âm (chỉ anh xem được)</text>

  <!-- Gemini -->
  <rect x="590" y="140" width="230" height="90" rx="12" fill="#fdf3e3" stroke="#e6a23c" stroke-width="2"/>
  <text x="705" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#b26a00">GEMINI — “giáo viên chấm bài”</text>
  <text x="705" y="192" text-anchor="middle" font-size="12" fill="#1a1a2e">AI của Google: chấm viết, dịch,</text>
  <text x="705" y="212" text-anchor="middle" font-size="12" fill="#1a1a2e">nghe audio, góp ý từng câu</text>

  <!-- GitHub -->
  <rect x="590" y="270" width="230" height="110" rx="12" fill="#f1ecfb" stroke="#7b5cd6" stroke-width="2"/>
  <text x="705" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#5a3fb8">GITHUB — “kho code + lịch sử”</text>
  <text x="705" y="322" text-anchor="middle" font-size="12" fill="#1a1a2e">lưu toàn bộ code + mọi commit</text>
  <text x="705" y="342" text-anchor="middle" font-size="12" fill="#1a1a2e">hỏng → quay lại mốc trước</text>
  <text x="705" y="362" text-anchor="middle" font-size="12" fill="#1a1a2e">Vercel tự cập nhật từ đây</text>

  <!-- Arrows -->
  <line x1="190" y1="200" x2="300" y2="185" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="190" y1="280" x2="300" y2="320" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="410" y1="230" x2="410" y2="270" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="520" y1="185" x2="590" y2="185" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="705" y1="270" x2="705" y2="230" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arr2)"/>

  <text x="245" y="185" text-anchor="middle" font-size="11" fill="#6b7280">học bài</text>
  <text x="245" y="305" text-anchor="middle" font-size="11" fill="#6b7280">dữ liệu</text>
  <text x="555" y="177" text-anchor="middle" font-size="11" fill="#6b7280">gửi bài chấm</text>
  <text x="720" y="252" text-anchor="middle" font-size="11" fill="#6b7280">code</text>

  <text x="430" y="412" text-anchor="middle" font-size="12.5" fill="#6b7280">Tất cả có gói miễn phí đủ cho 1 người dùng. Chi phí thật duy nhất có thể phát sinh: Gemini API (vài USD/tháng).</text>
</svg>
