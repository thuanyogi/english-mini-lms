        text: "Đau âm ỉ vùng thượng vị lan lên ngực trái."
      - id: "B"
        text: "Đau buốt nhói từ thắt lưng lan xuống mông phải và bắp chân."
      - id: "C"
        text: "Đau khớp gối hai bên kèm theo cứng khớp buổi sáng."
      - id: "D"
        text: "Đau đầu dữ dội kèm theo cảm giác hoa mắt chóng mặt."
    correct_option_id: "B"
    explanation: "Ở mốc 10–24s, bệnh nhân nói: 'I've had sharp, shooting pain starting in my lower back, traveling straight down my right buttock into my calf.'"
