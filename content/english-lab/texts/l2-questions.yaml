title: "Nghe hiểu: Tư vấn lâm sàng bệnh nhân đau rễ thần kinh thắt lưng"
segment_id: "seg-l2"
questions:
  - id: "q1"
    prompt: "Bệnh nhân mô tả vị trí và hướng lan của cơn đau như thế nào?"
